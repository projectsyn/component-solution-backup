name: Espejote render
on:
  pull_request:
  push:

env:
  ESPEJOTE_VERSION: 0.19.3

jobs:
  espejote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install espejote ${{ env.ESPEJOTE_VERSION }}
        run: |
          set -euo pipefail
          curl -sL "https://github.com/vshn/espejote/releases/download/v${ESPEJOTE_VERSION}/espejote_${ESPEJOTE_VERSION}_linux_amd64.tar.gz" | tar xz espejote
          sudo install -m 0755 espejote /usr/local/bin/espejote
      - name: Render and diff expected files
        run: make test-espejote
