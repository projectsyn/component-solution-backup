apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: override-schedules:solution-backup-manager
rules:
  - apiGroups:
      - ''
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - appcat.vshn.io
    resources:
      - objectbuckets
    verbs:
      - '*'
  - apiGroups:
      - k8up.io
    resources:
      - schedules
    verbs:
      - '*'
