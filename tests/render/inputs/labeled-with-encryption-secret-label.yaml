# Scenario labeled-with-encryption-secret-label — general reconciliation,
# namespace `test-app` opted in (opt-in label) and carrying the encryption
# secret label pointing at a custom Secret name `my-custom-encryption`. The
# Schedule's repoPasswordSecretRef.name must resolve to `my-custom-encryption`.
triggers:
  - {}
context:
  - name: backup_namespaces
    resources:
      - apiVersion: v1
        kind: Namespace
        metadata:
          name: test-app
          labels:
            vshn.ch/solution-base-backup: "true"
            vshn.ch/solution-base-backup-encryption-secret: my-custom-encryption
        status:
          phase: Active
libraries: {}
